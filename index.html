<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Action RPG</title>
    <link rel="stylesheet" href="style.css?v7">
</head>
<body>
    <div id="game-container"></div>
    <div id="ui-layer">
        <!-- Story Screen -->
        <div id="story-screen" class="screen hidden">
            <div class="story-box">
                <h1 style="color: #FFD700; font-family: serif; font-size: 36px; text-shadow: 2px 2px 4px #000;"><ruby>王国<rt>おうこく</rt></ruby>からの<ruby>緊急<rt>きんきゅう</rt></ruby><ruby>依頼<rt>いらい</rt></ruby></h1>
                <div class="story-images">
                    <span>👸</span> ➔ <span>🐸</span>
                </div>
                <p id="story-p1"></p>
                <p id="story-p2"></p>
                <button id="btn-story-next" class="primary-btn hidden"><ruby>冒険<rt>ぼうけん</rt></ruby>へ<ruby>出発<rt>しゅっぱつ</rt></ruby>する</button>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1 style="color: white; font-family: serif; font-size: 50px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">MATH HERO</h1>
            <p style="color: #ccc; font-size: 24px;">Action RPG & Quiz</p>
            <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 30px;">
                <button id="btn-new-game" class="primary-btn" style="margin-top: 0;">はじめから</button>
                <button id="btn-continue" class="primary-btn hidden" style="margin-top: 0; background: linear-gradient(45deg, #27ae60, #2ecc71);">つづきから</button>
            </div>
        </div>

        <div id="hud" class="hidden">
            <!-- Top Left: Player Status -->
            <div id="player-status">
                <div class="portrait">
                    <img src="assets/swordsman.png" alt="Player">
                </div>
                <div class="bars">
                    <div class="health-bar-bg"><div class="health-bar-fill"></div></div>
                    <div style="color: white; font-weight: bold; text-shadow: 1px 1px 2px black;">ステージ <span id="level-count">1</span> ・ クリスタル: <span id="progress-count">0</span>/<span id="crystals-needed">5</span></div>
                </div>
            </div>

            <!-- Quiz UI -->
            <div id="quiz-ui" class="hidden">
                <div id="timer-box">TIME: <span id="time-count">60</span>s</div>
                <div id="question-box">
                    <h2 id="question-text">Question Text</h2>
                </div>
            </div>

            <div id="instruction-box">
                <p id="instruction-text">クリスタルを<ruby>探<rt>さが</rt></ruby>してね！</p>
            </div>
        </div>

        <!-- Controls -->
        <div id="controls" class="hidden">
            <div id="joystick-zone"></div>

            <div id="action-buttons">
                <button id="btn-jump" class="action-btn">⬆️</button>
                <button id="btn-attack" class="action-btn large-btn">⚔️</button>
            </div>

            <div id="drag-hint">ここをドラッグして<ruby>移動<rt>移動</rt></ruby></div>
        </div>

        <!-- Quiz Answer Buttons -->
        <div id="quiz-answer-buttons" class="hidden">
            <button class="quiz-answer-btn"></button>
            <button class="quiz-answer-btn"></button>
            <button class="quiz-answer-btn"></button>
            <button class="quiz-answer-btn"></button>
        </div>

        <!-- Game Over / Clear Screens -->
        <div id="game-over-screen" class="screen hidden">
            <h1 id="game-over-title" style="color: #ff3333; font-family: serif;">つぎはがんばろう！</h1>
            <p id="final-score-wrap">スコア: <span id="final-score">0</span></p>
            <button id="btn-restart" class="primary-btn">もう<ruby>一度<rt>いちど</rt></ruby>！</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js?v7"></script>
</body>
</html>
